<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyektor Controller</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: black; 
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Tombol Toggle (Selalu ada di pojok) */
        #toggleBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            padding: 8px 12px;
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
        }

        /* Panel Kontrol */
        #controls {
            position: absolute;
            top: 50px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column; 
            gap: 10px;
        }
        input { padding: 10px; width: 220px; }
        button { padding: 10px; cursor: pointer; }

        /* Area Video */
        #videoPlayer {
            width: 100vh;
            aspect-ratio: 9 / 16;
            border: none;
            display: block;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <button id="toggleBtn" onclick="toggleControls()">Hide/Show Controls</button>

    <div id="controls">
        <input type="text" id="urlInput" placeholder="Paste link YouTube">
        <button onclick="loadVideo()">Load Video</button>
        <hr style="width:100%; border: 0.5px solid #555;">
        <button onclick="rotateVideo(90)">Rotate ↻ 90°</button>
        <button onclick="rotateVideo(-90)">Rotate ↺ 90°</button>
    </div>

    <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>

    <script>
        let currentRotation = 0;

        function toggleControls() {
            const controls = document.getElementById('controls');
            if (controls.style.display === 'none') {
                controls.style.display = 'flex';
            } else {
                controls.style.display = 'none';
            }
        }

        function loadVideo() {
            const url = document.getElementById('urlInput').value;
            const videoId = extractVideoID(url);
            if (videoId) {
                const embedUrl = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
                document.getElementById('videoPlayer').src = embedUrl;
            } else {
                alert("Link tidak valid!");
            }
        }

        function rotateVideo(deg) {
            currentRotation += deg;
            document.getElementById('videoPlayer').style.transform = `rotate(${currentRotation}deg)`;
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>
</body>
</html>
