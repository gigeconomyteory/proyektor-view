<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyektor Controller</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: black; display: flex; justify-content: center; align-items: center; }
        
        /* Tombol untuk memunculkan kembali (digeser ke 50px) */
        #showBtn {
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 5;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
            display: none;
        }

        /* Panel Kontrol (digeser ke 50px dan diputar) */
        #controls {
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            flex-direction: row; 
            gap: 8px;
            transform: rotate(-90deg);
            transform-origin: bottom left;
        }
        
        input { padding: 8px; width: 180px; border: none; border-radius: 3px; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 3px; background: #eee; }

        #videoPlayer {
            width: 100vh;
            aspect-ratio: 9 / 16;
            border: none;
            display: block;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <button id="showBtn" onclick="showControls()">⚙️</button>

    <div id="controls">
        <input type="text" id="urlInput" placeholder="Paste link YouTube...">
        <button onclick="loadVideo()">Load</button>
        <button onclick="rotateVideo(90)">↻</button>
        <button onclick="hideControls()">✕</button>
    </div>

    <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>

    <script>
        let currentRotation = 0;

        function hideControls() {
            document.getElementById('controls').style.display = 'none';
            document.getElementById('showBtn').style.display = 'block';
        }

        function showControls() {
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('showBtn').style.display = 'none';
        }

        function loadVideo() {
            const url = document.getElementById('urlInput').value;
            const videoId = extractVideoID(url);
            if (videoId) {
                document.getElementById('videoPlayer').src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
            } else {
                alert("Link tidak valid!");
            }
        }

        function rotateVideo(deg) {
            currentRotation += deg;
            document.getElementById('videoPlayer').style.transform = `rotate(${currentRotation}deg)`;
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>
</body>
</html>
