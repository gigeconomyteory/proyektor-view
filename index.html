<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyektor Portrait Controller</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: black; 
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Kontrol Input */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        input { padding: 8px; width: 250px; }
        button { padding: 8px 15px; cursor: pointer; }

        /* Kunci Player ke 9:16 (Portrait) */
        #videoPlayer {
            width: auto;
            height: 100vh; /* Mengikuti tinggi layar */
            aspect-ratio: 9 / 16; /* Memaksa bentuk Portrait */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="controls">
        <input type="text" id="urlInput" placeholder="Paste link YouTube (Shorts/Normal)">
        <button onclick="loadVideo()">Load Video</button>
    </div>

    <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>

    <script>
        function loadVideo() {
            const url = document.getElementById('urlInput').value;
            const videoId = extractVideoID(url);
            if (videoId) {
                // Menggunakan embed URL standar
                const embedUrl = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
                document.getElementById('videoPlayer').src = embedUrl;
                document.getElementById('controls').style.display = 'none';
            } else {
                alert("Link tidak valid!");
            }
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>
</body>
</html>
